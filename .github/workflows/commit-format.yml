name: Commit message format

# CI backstop for Conventional Commits (see AGENTS.md's "Commit messages"
# section). The local .githooks/commit-msg hook catches this too, but it is
# opt-in per clone (`git config core.hooksPath .githooks`), so this job
# re-checks every commit on the pull request regardless of whether the
# author enabled it. Deliberately not gated by `paths:` — commit hygiene
# applies to every PR, not just ones touching build tooling — and
# deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets.
#
# main only accepts squash merges, so the PR title (not any individual
# branch commit) becomes the commit that actually lands on main — GitHub
# defaults the squash commit subject to the PR title. This job checks the PR
# title for that reason, and still checks every branch commit too, since
# clean intermediate commits make the PR easier to review even though they
# are discarded on squash.
#
# Both this job and the local hook call .githooks/check-commit-format.sh, so
# the Conventional Commits pattern itself lives in exactly one place.
#
# The title is fetched live (`gh pr view --json title`), keyed on the
# event's own immutable PR number, rather than read from
# `github.event.pull_request.title`'s snapshot of the triggering event — so
# a rerun of a stale run (no new push) picks up a since-edited title instead
# of replaying the same text and failing again (issue #1991).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-format:
    runs-on: ubuntu-latest
    # A merge-group candidate carries no pull request event data to check
    # (title, individual commits) and nothing here changes between the
    # pull_request run that already validated it and the queue picking it
    # up, so this reports skipped rather than re-running with nothing to
    # check — a skipped conclusion still satisfies a required status check.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate PR title against Conventional Commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh pr view "$PR_NUMBER" --repo "$PR_REPO" --json title -q .title)"
          bash .githooks/check-commit-format.sh "$PR_TITLE"

      - name: Validate commit messages against Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r subject; do
            [ -n "$subject" ] || continue
            if ! bash .githooks/check-commit-format.sh "$subject"; then
              status=1
            fi
          done < <(git log --format=%s "${BASE_SHA}..${HEAD_SHA}")
          exit "$status"
