name: Table of Contents check

# Gates the generated table of contents in docs/spec/implementation/README.md,
# docs/spec/dashboard/README.md and each guide under docs/guides/: each must be exactly what
# scripts/render-toc.sh renders from their ## and ### headings, or a heading
# can drift out of the ToC (see the script's own header). Modelled on
# config-table.yml.
#
# Deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets, and ungated by `paths:` — a heading edit
# without a matching ToC edit both need catching, and either can touch files
# outside a narrow path filter.
#
# The `merge_group:` trigger is required for this context to report inside
# the merge queue — without it, a required `toc` would stall every queue
# entry for the ruleset's 60-minute `check_response_timeout_minutes`.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  toc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check generated table of contents is fresh
        run: scripts/render-toc.sh --check
