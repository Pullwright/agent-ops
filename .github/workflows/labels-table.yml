name: Labels table check

# Gates the generated labels table: docs/reference/labels.md's table must be
# exactly what scripts/render-labels-table.sh renders from lib/labels.sh's
# own catalogue, or a label can drift out of the one prose copy the same way
# a configuration key could before config-table.yml existed (see the
# script's own header).
#
# Deliberately `pull_request` (not `pull_request_target`), so a fork PR never
# runs with write-scoped secrets, and ungated by `paths:` — a catalogue edit
# without a matching doc edit, or a doc edit without a matching catalogue
# edit, both need catching, and either can touch files outside a narrow path
# filter.
#
# The `merge_group:` trigger is required for this context to report inside
# the merge queue — without it, a required `labels-table` would stall every
# queue entry for the ruleset's 60-minute `check_response_timeout_minutes`.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  labels-table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the generated labels table is fresh
        run: scripts/render-labels-table.sh --check
